<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nailson Santos</title>
<style>
  :root {
    --navy-deep: #10182c;
    --navy: #1f2a44;
    --navy-light: #2c3a5e;
    --gold: #c6a35f;
    --gold-soft: #e4cf9f;
    --text: #eef1f7;
    --text-dim: #9aa3ba;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  body {
    margin: 0;
    min-height: 100%;
    font-family: "Georgia", "Iowan Old Style", serif;
    background: radial-gradient(circle at 50% -10%, var(--navy-light), var(--navy-deep) 60%);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 48px 20px 64px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }

  .ring {
    width: 108px;
    height: 108px;
    margin: 0 auto 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg, var(--gold-soft), var(--gold));
    box-shadow: 0 12px 30px -12px rgba(0,0,0,0.6);
  }
  .ring span {
    font-family: "Trebuchet MS", sans-serif;
    font-weight: 700;
    font-size: 34px;
    color: var(--navy-deep);
    letter-spacing: 1px;
  }

  h1 {
    font-size: 28px;
    font-weight: 400;
    margin: 0 0 6px;
    letter-spacing: 0.3px;
  }

  .role {
    font-family: "Trebuchet MS", sans-serif;
    color: var(--gold);
    font-size: 13px;
    letter-spacing: 3px;
    margin: 0 0 40px;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .link {
    display: flex;
    align-items: center;
    gap: 14px;
    text-decoration: none;
    color: var(--text);
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(198,163,95,0.28);
    border-radius: 12px;
    padding: 16px 20px;
    font-family: "Trebuchet MS", sans-serif;
    font-size: 16px;
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
  }
  .link:hover, .link:focus-visible {
    background: rgba(198,163,95,0.10);
    border-color: var(--gold);
    transform: translateY(-1px);
  }
  .link:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .icon {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    fill: var(--gold-soft);
  }

  .label { flex: 1; text-align: left; }
  .arrow { color: var(--text-dim); font-size: 14px; }

  footer {
    margin-top: 46px;
    font-family: "Trebuchet MS", sans-serif;
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--text-dim);
  }

  @media (prefers-reduced-motion: reduce) {
    .link { transition: none; }
  }
</style>
</head>
